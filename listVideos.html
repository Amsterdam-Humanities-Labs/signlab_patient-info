<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Selection Tool</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Styles from contents.html */
        table {
          width: 100%;
          border-collapse: collapse;
          margin-bottom: 1rem;
        }
        th, td {
          padding: 0.75rem;
          text-align: left;
          border-bottom: 1px solid #dee2e6;
        }
        th {
          background-color: #f8f9fa;
          font-weight: 600;
        }
        tr:hover {
          background-color: rgba(0, 0, 0, 0.03);
        }
        .search-container {
          display: flex;
          margin-bottom: 1rem;
        }
        .search-input {
          flex: 1;
          padding: 0.5rem 1rem;
          border: 1px solid #ced4da;
          border-radius: 0.25rem;
        }
        .pagination {
          display: flex;
          justify-content: center;
          gap: 0.5rem;
          margin-top: 1.5rem;
        }
        .pagination button {
          padding: 0.5rem 1rem;
          border: 1px solid #ced4da;
          background-color: white;
          border-radius: 0.25rem;
          cursor: pointer;
          transition: background-color 0.2s;
        }
        .pagination button:hover {
          background-color: #f1f3f5;
        }
        .pagination button.active {
          background-color: #339af0;
          color: white;
          border-color: #339af0;
        }
        .loading {
          display: flex;
          justify-content: center;
          align-items: center;
          height: 300px;
        }
        .spinner {
          border: 4px solid rgba(0, 0, 0, 0.1);
          width: 36px;
          height: 36px;
          border-radius: 50%;
          border-left: 4px solid #339af0;
          animation: spin 1s linear infinite;
        }
        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
        
        /* Navbar styling from contents.html */
        .navbar {
          background-color: #f8f9fa;
          padding: 1rem;
          margin-bottom: 2rem;
          border-radius: 0.25rem;
          display: flex;
          flex-wrap: wrap;
          gap: 1rem;
        }
        
        .navbar a {
          color: #495057;
          text-decoration: none;
          padding: 0.5rem 1rem;
          border-radius: 0.25rem;
          transition: background-color 0.2s;
        }
        
        .navbar a:hover {
          background-color: #e9ecef;
        }
        
        .navbar a.active {
          background-color: #339af0;
          color: white;
        }
        
        .header {
          margin-bottom: 2rem;
        }
        
        .container {
          max-width: 1200px;
          margin: 0 auto;
          padding: 1rem;
        }

        /* Existing video selector styles */
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            color: #333;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        
        .container {
            margin-bottom: 30px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        
        th {
            background-color: #f2f2f2;
        }
        
        tr:hover {
            background-color: #f5f5f5;
        }
        
        .transcription-row {
            cursor: pointer;
            font-weight: bold;
            background-color: #e9ecef;
        }
        
        .video-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 10px;
            margin-bottom: 20px;
            padding-left: 30px;
        }
        
        .video-item {
            width: 280px;
            border: 2px solid #ddd;
            border-radius: 4px;
            padding: 10px;
            position: relative;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .video-item:hover {
            box-shadow: 0 0 8px rgba(0,0,0,0.2);
        }
        
        .video-item.selected {
            border: 2px solid #28a745;
            box-shadow: 0 0 8px rgba(40,167,69,0.5);
        }
        
        .video-tag {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #007bff;
            color: white;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 12px;
        }
        
        video {
            width: 100%;
            height: auto;
            max-height: 200px;
        }
        
        .video-info {
            margin-top: 8px;
            font-size: 14px;
        }
        
        .video-info p {
            margin: 5px 0;
            word-break: break-all;
            font-size: 13px;
        }
        
        .action-btn {
            padding: 8px 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s;
        }
        
        .action-btn:hover {
            background-color: #0069d9;
        }
        
        .action-btn:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }
        
        .hidden {
            display: none !important;
        }
        
        .videos-row {
            background-color: #f9f9f9;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            font-style: italic;
            color: #6c757d;
        }
        
        .no-data {
            text-align: center;
            padding: 20px;
            font-style: italic;
            color: #6c757d;
        }
        
        .confirmation-dialog {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0,0,0,0.5);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .confirmation-content {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            width: 400px;
            max-width: 90%;
        }
        
        .confirmation-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        
        .confirmation-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
        
        .btn-cancel {
            padding: 8px 12px;
            background-color: #6c757d;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .btn-confirm {
            padding: 8px 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .search-container {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }
        
        .search-input {
            flex-grow: 1;
            padding: 8px 12px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 16px;
        }
        
        .status-message {
            padding: 10px 15px;
            margin: 10px 0;
            border-radius: 4px;
            font-size: 16px;
        }
        
        .status-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        /* New styles for text modal */
        .text-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0,0,0,0.5);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .text-modal-content {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            width: 80%;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .text-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #dee2e6;
        }
        
        .text-modal-title {
            font-size: 20px;
            font-weight: bold;
        }
        
        .text-modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #6c757d;
        }
        
        .text-modal-body {
            white-space: pre-wrap;
            font-family: inherit;
            line-height: 1.5;
        }
        
        .toggle-deleted-btn {
            background-color: #6c757d;
            margin-left: 10px;
        }
        
        .deleted-badge {
            background-color: #dc3545;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 8px;
            font-size: 12px;
            display: inline-block;
        }
        
        .restore-btn {
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 12px;
            cursor: pointer;
            margin-top: 5px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Video Selection Tool</h1>
    </div>
    
    <div class="navbar">
        <a href="index.html">Dashboard</a>
        <a href="contents.html">View Contents</a>
        <a href="words.html">View Words Statistics</a>
        <a href="sentences.html">View Sentences Statistics</a>
        <a href="begrippenlijst.html">Begrippenlijst</a>
        <a href="listVideos.html" class="active">Video Selector</a>
    </div>
    
    <div id="status-message" class="hidden"></div>
    
    <div class="search-container">
        <input type="text" id="search-input" class="search-input" placeholder="Search transcriptions...">
        <button id="search-btn" class="action-btn">Search</button>
    </div>
    
    <table id="transcriptions-table">
        <thead>
            <tr>
                <th>Content</th>
                <th>Number of Videos</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="transcriptions-body">
            <!-- Transcriptions will be loaded here -->
        </tbody>
    </table>
    
    <div id="loading" class="loading">Loading transcriptions...</div>
    <div id="no-data" class="no-data hidden">No transcriptions found.</div>
</div>

<div id="text-modal" class="text-modal hidden">
    <div class="text-modal-content">
        <div class="text-modal-header">
            <div class="text-modal-title">Content Text</div>
            <button class="text-modal-close" id="text-close-btn">&times;</button>
        </div>
        <div class="text-modal-body" id="full-text-content">
            <!-- Full text content will be loaded here -->
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const transcriptionsBody = document.getElementById('transcriptions-body');
        const loadingDiv = document.getElementById('loading');
        const noDataDiv = document.getElementById('no-data');
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const statusMessage = document.getElementById('status-message');
        const textModal = document.getElementById('text-modal');
        const fullTextContent = document.getElementById('full-text-content');
        const textCloseBtn = document.getElementById('text-close-btn');
        
        let expandedTranscription = null;
        let contentCache = {};
        
        // Load transcriptions
        function loadTranscriptions() {
            loadingDiv.classList.remove('hidden');
            noDataDiv.classList.add('hidden');
            
            fetch('listVideos.php?action=get_transcriptions')
                .then(response => response.json())
                .then(data => {
                    loadingDiv.classList.add('hidden');
                    
                    if (data.error) {
                        showStatusMessage(data.error, 'error');
                        return;
                    }
                    
                    if (!data.data || data.data.length === 0) {
                        noDataDiv.classList.remove('hidden');
                        return;
                    }
                    
                    renderTranscriptions(data.data);
                })
                .catch(error => {
                    loadingDiv.classList.add('hidden');
                    showStatusMessage('Failed to load transcriptions: ' + error.message, 'error');
                });
        }
        
        // Render transcriptions table
        function renderTranscriptions(transcriptions) {
            transcriptionsBody.innerHTML = '';
            
            const searchTerm = searchInput.value.trim().toLowerCase();
            let hasMatches = false;
            
            transcriptions.forEach(transcription => {
                const transcriptionText = transcription.m_transcription;
                const firstLine = transcription.first_line || transcription.m_transcription;
                const plainText = transcription.plain_text || '';
                const contentId = transcription.content_id;
                
                // Save to content cache
                contentCache[transcriptionText] = {
                    plainText: plainText,
                    contentId: contentId
                };
                
                // If search term exists and there's no match in either field, skip this item
                if (searchTerm && 
                    !transcriptionText.toLowerCase().includes(searchTerm) && 
                    !firstLine.toLowerCase().includes(searchTerm) &&
                    !plainText.toLowerCase().includes(searchTerm)) {
                    return;
                }
                
                hasMatches = true;
                
                // Create the main transcription row
                const row = document.createElement('tr');
                row.className = 'transcription-row';
                row.setAttribute('data-transcription', transcriptionText);
                
                row.innerHTML = `
                    <td>${firstLine}</td>
                    <td>${transcription.count}</td>
                    <td>
                        <button class="action-btn toggle-videos-btn">Show Videos</button>
                        <button class="action-btn view-text-btn" data-transcription="${transcriptionText}">View Text</button>
                    </td>
                `;
                
                // Add click handler for the buttons
                row.querySelector('.toggle-videos-btn').addEventListener('click', function(e) {
                    e.stopPropagation();
                    toggleVideos(transcriptionText);
                });
                
                row.querySelector('.view-text-btn').addEventListener('click', function(e) {
                    e.stopPropagation();
                    showFullText(transcriptionText);
                });
                
                transcriptionsBody.appendChild(row);
                
                // Create container for videos (initially hidden)
                const videosRow = document.createElement('tr');
                videosRow.className = 'videos-row hidden';
                videosRow.setAttribute('data-transcription', transcriptionText);
                
                const videosCell = document.createElement('td');
                videosCell.colSpan = 3;
                
                const videoContainer = document.createElement('div');
                videoContainer.className = 'video-container';
                videoContainer.innerHTML = '<div class="loading">Loading videos...</div>';
                
                videosCell.appendChild(videoContainer);
                videosRow.appendChild(videosCell);
                transcriptionsBody.appendChild(videosRow);
            });
            
            if (!hasMatches && searchTerm) {
                noDataDiv.textContent = `No transcriptions matching "${searchTerm}" found.`;
                noDataDiv.classList.remove('hidden');
            } else if (!hasMatches) {
                noDataDiv.textContent = 'No transcriptions found.';
                noDataDiv.classList.remove('hidden');
            }
        }
        
        // Toggle videos for a transcription
        function toggleVideos(transcription) {
            const videosRow = document.querySelector(`.videos-row[data-transcription="${transcription}"]`);
            const button = document.querySelector(`.transcription-row[data-transcription="${transcription}"] .toggle-videos-btn`);
            
            if (videosRow.classList.contains('hidden')) {
                // Close any other open videos
                if (expandedTranscription && expandedTranscription !== transcription) {
                    const prevVideosRow = document.querySelector(`.videos-row[data-transcription="${expandedTranscription}"]`);
                    const prevButton = document.querySelector(`.transcription-row[data-transcription="${expandedTranscription}"] .toggle-videos-btn`);
                    
                    if (prevVideosRow && prevButton) {
                        prevVideosRow.classList.add('hidden');
                        prevButton.textContent = 'Show Videos';
                    }
                }
                
                // Update expanded transcription
                expandedTranscription = transcription;
                
                // Show videos
                videosRow.classList.remove('hidden');
                button.textContent = 'Hide Videos';
                
                // Load videos if container is empty or just shows loading
                const videoContainer = videosRow.querySelector('.video-container');
                if (videoContainer.innerHTML === '<div class="loading">Loading videos...</div>') {
                    loadVideosForTranscription(transcription, videoContainer);
                }
            } else {
                // Hide videos
                videosRow.classList.add('hidden');
                button.textContent = 'Show Videos';
                expandedTranscription = null;
            }
        }
        
        // Load videos for a specific transcription
        function loadVideosForTranscription(transcription, container, includeDeleted = false) {
            let url = `listVideos.php?action=get_videos_for_transcription&transcription=${encodeURIComponent(transcription)}`;
            if (includeDeleted) {
                url += '&include_deleted=true';
            }
            
            container.innerHTML = '<div class="loading">Loading videos...</div>';
            
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        container.innerHTML = `<div class="status-error">${data.error}</div>`;
                        return;
                    }
                    
                    if (!data.data || data.data.length === 0) {
                        container.innerHTML = '<div class="no-data">No videos found for this transcription.</div>';
                        return;
                    }
                    
                    // Save content data to cache if available
                    if (data.content && data.content.plain_text) {
                        contentCache[transcription] = {
                            plainText: data.content.plain_text,
                            contentId: data.content.content_id
                        };
                    }
                    
                    renderVideos(data.data, container, transcription, includeDeleted);
                })
                .catch(error => {
                    container.innerHTML = `<div class="status-error">Failed to load videos: ${error.message}</div>`;
                });
        }
        
        // Render videos in the container
        function renderVideos(videos, container, transcription, includeDeleted) {
            container.innerHTML = '';
            
            // Add control buttons at the top
            const controlsDiv = document.createElement('div');
            controlsDiv.style.width = '100%';
            controlsDiv.style.marginBottom = '20px';
            controlsDiv.style.display = 'flex';
            controlsDiv.style.justifyContent = 'space-between';
            
            const toggleDeletedBtn = document.createElement('button');
            toggleDeletedBtn.className = 'action-btn toggle-deleted-btn';
            toggleDeletedBtn.textContent = includeDeleted ? 'Hide Deleted Videos' : 'Show Deleted Videos';
            toggleDeletedBtn.addEventListener('click', function() {
                loadVideosForTranscription(transcription, container, !includeDeleted);
            });
            
            const restoreAllBtn = document.createElement('button');
            restoreAllBtn.className = 'action-btn';
            restoreAllBtn.style.backgroundColor = '#28a745';
            restoreAllBtn.textContent = 'Restore All Deleted Videos';
            restoreAllBtn.style.display = includeDeleted ? 'block' : 'none';
            restoreAllBtn.addEventListener('click', function() {
                restoreDeletedVideos(transcription, container);
            });
            
            controlsDiv.appendChild(toggleDeletedBtn);
            controlsDiv.appendChild(restoreAllBtn);
            
            container.appendChild(controlsDiv);
            
            // Add videos
            videos.forEach(video => {
                const videoItem = document.createElement('div');
                videoItem.className = 'video-item';
                videoItem.setAttribute('data-id', video.id);
                videoItem.setAttribute('data-transcription', video.m_transcription);
                
                const isDeleted = video.added === 'DELETE';
                
                let videoHtml = `
                    <div class="video-tag">ID: ${video.id}</div>
                    <video controls>
                        <source src="${video.video_url}" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                    <div class="video-info">
                        <p><strong>File:</strong> ${video.m_file}</p>
                        <p>
                            <strong>Status:</strong> ${isDeleted ? 
                                `<span class="deleted-badge">Deleted</span>` : 
                                (video.added || '1')}
                        </p>
                `;
                
                if (isDeleted) {
                    videoHtml += `
                        <button class="restore-btn" data-id="${video.id}">Restore This Video</button>
                    `;
                } else {
                    videoHtml += `
                        <button class="action-btn" style="background-color: #dc3545; margin-top: 5px;" data-id="${video.id}">Delete This Video</button>
                    `;
                }
                
                videoHtml += `</div>`;
                videoItem.innerHTML = videoHtml;
                
                // Add event listener for restore button if present
                const restoreBtn = videoItem.querySelector('.restore-btn');
                if (restoreBtn) {
                    restoreBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        restoreSingleVideo(video.id, transcription, container);
                    });
                }
                
                // Add event listener for delete button if present
                const deleteBtn = videoItem.querySelector('.action-btn[style*="dc3545"]');
                if (deleteBtn) {
                    deleteBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        deleteVideo(video.id, transcription, container);
                    });
                }
                
                container.appendChild(videoItem);
            });
        }
        
        // Delete a single video
        function deleteVideo(videoId, transcription, container) {
            if (!confirm('Are you sure you want to delete this video?')) {
                return;
            }
            
            const formData = new FormData();
            formData.append('video_id', videoId);
            formData.append('transcription', transcription);
            
            fetch('listVideos.php?action=delete_single_video', {
                method: 'POST',
                body: formData
            })
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        showStatusMessage(data.error, 'error');
                        return;
                    }
                    
                    showStatusMessage(data.message || 'Video deleted successfully', 'success');
                    
                    // Remove the video item from the DOM
                    const videoItem = container.querySelector(`.video-item[data-id="${videoId}"]`);
                    if (videoItem) {
                        videoItem.remove();
                    }
                    
                    // Update the count in the transcription row
                    updateTranscriptionCount(transcription, -1);
                    
                    // Check if there are any remaining videos in the container
                    const remainingVideos = container.querySelectorAll('.video-item');
                    if (remainingVideos.length === 0) {
                        // If no videos left, show a message
                        const actionDiv = container.querySelector('div[style*="margin-top: 20px"]');
                        if (actionDiv) {
                            actionDiv.innerHTML = '<p>No videos remaining for this transcription.</p>';
                        }
                    }
                })
                .catch(error => {
                    showStatusMessage('Failed to delete video: ' + error.message, 'error');
                });
        }
        
        // Update transcription count in the main table
        function updateTranscriptionCount(transcription, countChange) {
            const transcriptionRow = document.querySelector(`.transcription-row[data-transcription="${transcription}"]`);
            if (transcriptionRow) {
                const countCell = transcriptionRow.cells[1]; // Second column is the count
                const currentCount = parseInt(countCell.textContent) || 0;
                const newCount = Math.max(0, currentCount + countChange);
                countCell.textContent = newCount;
                
                // If count reaches 0, optionally hide the row or show a different message
                if (newCount === 0) {
                    countCell.textContent = '0 (no active videos)';
                    countCell.style.fontStyle = 'italic';
                    countCell.style.color = '#6c757d';
                }
            }
        }
        
        // Restore a single deleted video
        function restoreSingleVideo(videoId, transcription, container) {
            const formData = new FormData();
            formData.append('video_id', videoId);
            formData.append('transcription', transcription);
            
            fetch('listVideos.php?action=restore_single_video', {
                method: 'POST',
                body: formData
            })
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        showStatusMessage(data.error, 'error');
                        return;
                    }
                    
                    showStatusMessage(data.message || 'Video restored successfully', 'success');
                    
                    // Remove the video item from the current view (since it's no longer deleted)
                    const videoItem = container.querySelector(`.video-item[data-id="${videoId}"]`);
                    if (videoItem) {
                        videoItem.remove();
                    }
                    
                    // Update the count in the transcription row
                    updateTranscriptionCount(transcription, 1);
                })
                .catch(error => {
                    showStatusMessage('Failed to restore video: ' + error.message, 'error');
                });
        }
        
        // Handle search
        searchBtn.addEventListener('click', function() {
            loadTranscriptions();
        });
        
        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                loadTranscriptions();
            }
        });
        
        // Show status message
        function showStatusMessage(message, type) {
            statusMessage.innerHTML = message;
            statusMessage.className = type === 'error' ? 'status-message status-error' : 'status-message status-success';
            statusMessage.classList.remove('hidden');
            
            // Auto-hide after 5 seconds
            setTimeout(() => {
                statusMessage.classList.add('hidden');
            }, 5000);
        }
        
        // Initial load
        loadTranscriptions();
    });
</script>
</body>
</html>
